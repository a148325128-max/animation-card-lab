<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玻璃环绕 · 免费动画模板</title><link rel="stylesheet" href="./orbit.css"><style>body{margin:0;background:#101820;color:#dce8ee;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{height:88px;padding:20px 30px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0 0 5px}header p{font-size:12px;color:#8c9fad;margin:0}header span{font-size:11px;color:#91b6ce}main{display:grid;grid-template-columns:minmax(480px,1fr) 300px;max-width:1550px;margin:auto}.canvas-side{padding:24px}.stage-wrap{height:calc(100vh - 240px);min-height:520px;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff12;border-radius:12px;background:#080e14;overflow:hidden;position:relative}.stage-holder{position:relative}#stage{position:absolute;left:0;top:0;transform-origin:top left}.controls{padding:20px 24px;border-left:1px solid #ffffff12;max-height:calc(100vh - 88px);overflow:auto}label{display:block;font-size:12px;color:#9eb3c0;margin:16px 0}input,textarea,select,button{font:inherit}input,textarea,select{display:block;width:100%;margin-top:8px;padding:9px;border:1px solid #ffffff1c;background:#192630;color:#e5eef4;border-radius:6px}input[type=range]{padding:0;accent-color:#b5d9ff}button{background:#1d303d;color:#e5eef4;border:1px solid #ffffff24;border-radius:7px;padding:10px 14px;cursor:pointer}button:hover{background:#2a4558}.primary{background:#d7eaff;color:#1a3044;border:0}.primary:hover{background:#fff}button:disabled{opacity:.5}.playback{display:flex;align-items:center;gap:15px;margin:18px 0}.playback input{margin:0;flex:1}.playback span{width:65px;font-variant-numeric:tabular-nums}.actions{display:flex;align-items:center;gap:10px}.actions a{color:#b5d9ff}.hint{font-size:11px;color:#849aa9;line-height:1.7}#status{font-size:12px;color:#a8c4d6;min-height:35px;line-height:1.6;margin-top:12px}.controls h2{font-size:14px;margin:0 0 18px}textarea{line-height:1.8;resize:vertical}input[type=file]{font-size:11px}hr{border:0;border-top:1px solid #ffffff12;margin:25px 0}@media(max-width:800px){main{grid-template-columns:1fr}.controls{max-height:none;border:0}.stage-wrap{height:620px}.canvas-side{padding:12px}}</style></head><body><header><div><h1>玻璃环绕 / GLASS ORBIT</h1><p>图标 / 播放器 · 两种环绕样式 · 主体可替换</p></div><span>免费模板 · <a href="/">返回卡片库</a></span></header><main><section class="canvas-side"><div class="stage-wrap"><div class="stage-holder"><div id="stage"><div class="floor-shadow"></div><div id="cards"></div><div id="subject"></div></div></div></div><div class="playback"><button id="play">暂停</button><input id="seek" type="range" min="0" max="8" step=".01" value="0"><span id="time">0.00 s</span></div><div class="actions"><button id="export" class="primary">导出一圈 MP4</button><button id="save">保存参数 JSON</button><label style="margin:0"><input id="load" type="file" accept="application/json" hidden><button id="loadButton">读取参数</button></label><a id="result" hidden download>下载视频</a></div><p id="env" class="hint"></p><div id="status">图标无文字版：可直接播放、调整速度和导出。</div><p class="hint">动画独立实现。图标支持自行上传；原播放器版的抽象封面为自制图案。两种样式都不播放音乐。</p></section><aside class="controls"><h2>编辑环绕动画</h2><label>动画样式<select id="variant"><option value="logos">图标环绕 · 无文字</option><option value="player">播放器卡片 · 原版</option></select></label><p id="logoHint" class="hint">默认是自制抽象图标，可上传六张自己的 Logo，三层轨道交错排列。</p><div id="logoUploads"></div><label id="labelsField">卡片标题（六行，三层复用）<textarea id="labels" rows="6"></textarea></label><label>一圈时长 / 秒<input id="period" type="number" min="4" max="16" step="1" value="8"></label><label>旋转方向<select id="direction"><option value="1">向右环绕</option><option value="-1">向左环绕</option></select></label><label>环绕半径<input id="radius" type="range" min="195" max="290" value="252"></label><label>玻璃模糊<input id="blur" type="range" min="0" max="24" value="12"></label><label>玻璃底色浓度<input id="opacity" type="range" min=".06" max=".35" step=".01" value=".16"></label><label>画幅<select id="aspect"><option value="3:4">3:4 · 与参考一致</option><option value="9:16">9:16 · 竖屏</option><option value="16:9">16:9 · 横屏</option></select></label><hr><h2>更换中央主体</h2><label>中央主体<select id="subjectMode"><option value="none">仅环绕动画</option><option value="product">中性产品 · 遮挡验证</option><option value="image">自选图片</option></select></label><label>主体图片<input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>主体大小<input id="subjectScale" type="range" min=".5" max="1.5" step=".05" value="1"></label><p class="hint">人物或产品要呈现自然的前后遮挡，请使用透明背景 PNG/WebP；此处不会自动抠图。后续演示人物和产品素材另行制作。</p></aside></main><script src="./orbit.js"></script><script src="./studio.js"></script><script src="/advanced/environment.js"></script></body></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动效研究 · 卡片轮播与光流片头</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151b;color:#e3e9f0;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{padding:22px 30px;border-bottom:1px solid #ffffff15}h1{font-size:20px;margin:0 0 8px}p{color:#91a5b9;font-size:12px;line-height:1.7;margin:0}main{display:grid;grid-template-columns:minmax(500px,1fr) 330px;max-width:1500px;margin:auto}.preview{padding:20px}.wrap{height:calc(100vh - 250px);min-height:460px;background:#050609;border-radius:12px;display:grid;place-items:center;overflow:hidden}.holder{position:relative}iframe{position:absolute;top:0;left:0;transform-origin:top left;width:720px;height:1280px;border:0;background:#000}.sidebar{padding:22px;border-left:1px solid #ffffff12;max-height:calc(100vh - 95px);overflow:auto}label{display:block;margin:16px 0;color:#a2b5c8;font-size:12px}input,textarea,select,button{font:inherit}input,select{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid #ffffff20;border-radius:6px;background:#1a2633;color:#edf3f9}input[type=range]{padding:0;accent-color:#66d7ed}input[type=checkbox]{width:auto;display:inline;margin-right:8px}button,.link{background:#203343;border:1px solid #ffffff20;border-radius:6px;padding:10px 14px;color:#e8f6ff;cursor:pointer}button:disabled{opacity:.5}.primary{background:#83e7de;color:#113430}.bar{display:flex;align-items:center;gap:12px;margin:15px 0}.bar input{flex:1;margin:0}.bar span{width:70px;font-variant-numeric:tabular-nums}.actions{display:flex;gap:8px;flex-wrap:wrap}#status{margin-top:13px;min-height:35px}a{color:#90e6ec}#load{display:none}.image-slot{border:1px solid #ffffff13;padding:10px;margin:10px 0;border-radius:8px}.image-slot label{margin:5px 0}.image-slot img{width:70px;height:40px;object-fit:cover;border-radius:3px}input[type=file]{font-size:10px}h2{font-size:14px}.note{margin-top:18px}[hidden]{display:none!important}@media(max-width:800px){main{grid-template-columns:1fr}.sidebar{max-height:none}.wrap{height:600px}}
</style><header><h1>动效研究 / MOTION STUDIES</h1><p>卡片轮播 · 光流形变片头　｜　免费可编辑模板　<a href="/">返回卡片库</a></p></header><main><section class="preview"><div class="wrap"><div class="holder"><iframe id="scene" title="动画预览"></iframe></div></div><div class="bar"><button id="play">暂停</button><input id="seek" type="range" min="0" max="9" step=".01"><span id="time">0.00s</span></div><div class="actions"><button id="export" class="primary">导出 MP4</button><button id="save">保存参数</button><button id="loadButton">读取参数</button><input id="load" type="file" accept="application/json"><a id="result" class="link" hidden>下载视频</a></div><p id="env" class="note"></p><p id="status">正在载入动画。</p><p class="note">画面为自有代码重建。轮播默认图片为自制示意图，可上传自己的图片。视频导出为720×1280、30fps、无声；原参考视频保留作内部分析。</p></section><aside class="sidebar"><h2>选择动画</h2><label>模板<select id="kind"><option value="carousel">01 · 纵向卡片轮播</option><option value="gradient">02 · 光流形变片头</option></select></label><label>完整时长 / 秒<input id="duration" type="number" min="6" max="16" step="1"></label><label><input id="showText" type="checkbox">显示自定义文字</label><div id="carouselFields"></div><div id="gradientFields" hidden><label>主标题<input id="title" maxlength="40"></label><label>副标题<input id="subtitle" maxlength="40"></label><label>青色光效<input id="accent" type="color" value="#39f6d2"></label></div><p class="note">当前先验证开头动效与编辑复用。光流版是独立重建的近似效果，未逐像素还原参考片。</p></aside></main><script src="./studio.js"></script></html>
